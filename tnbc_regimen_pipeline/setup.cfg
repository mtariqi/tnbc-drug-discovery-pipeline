[metadata]
license_files = LICENSE

[options]
packages = find:
include_package_data = True

[options.package_data]
tnbc_regimen_pipeline = config/config.yaml

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = .git,__pycache__,outputs,.pipeline_cache
